name: Verify
# Every push already runs `npm run verify` locally before it lands, so CI is
# kept for pull requests and on-demand runs only. Linux is the deployment
# target; the macOS job was dropped because its PTY process-tree checks
# failed on every run for runner-specific reasons unrelated to the product.
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
